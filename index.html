<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CrashX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0716;--panel:#161027;--line:#2a1f4a;--purple:#7c3aed;--blue:#2f7bff;--green:#22e37a;--red:#ff3b5c;--yellow:#ffd23f;--text:#f1ecff;--dim:#8d82b3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;user-select:none}
body{background:radial-gradient(120% 60% at 50% 0%,#24104f 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{display:none;position:absolute;inset:0;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.av{width:40px;height:40px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:none;border:2px solid var(--purple)}
.av img{width:100%;height:100%;object-fit:cover}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--dim);font-size:11px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-weight:800;box-shadow:0 0 14px rgba(124,58,237,.35);white-space:nowrap}
#dep{background:linear-gradient(135deg,#9b5cff,#6d28d9);border-radius:20px;padding:9px 14px;font-weight:800;font-size:13px;box-shadow:0 0 16px rgba(124,58,237,.6);transition:transform .12s}
#dep:active{transform:scale(.92)}
/* live bar */
.live{display:flex;align-items:center;gap:8px;margin:2px 14px 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;overflow:hidden}
.lv{display:flex;align-items:center;gap:5px;font-weight:800;font-size:12px;flex:none}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.2s infinite}
.mq{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.trk{display:flex;gap:8px;width:max-content;animation:mq 22s linear infinite}
.trk span{background:#1f1639;border-radius:10px;padding:3px 8px;font-size:15px;white-space:nowrap}
.trk em{font-style:normal;font-size:10px;color:var(--green);font-weight:800;margin-left:4px}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
/* lobby cards */
.cards{flex:1;overflow-y:auto;padding:0 14px 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{position:relative;overflow:hidden;border-radius:24px;padding:16px;text-align:left;color:#fff;flex:none;transition:transform .15s}
.card:active{transform:scale(.97)}
.card h3{font-size:22px;font-weight:800;letter-spacing:-.3px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.card p{font-size:12px;opacity:.85;margin-top:2px}
.badge{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:10px;z-index:3}
.hot{background:linear-gradient(135deg,#ffb020,#ff6a00);box-shadow:0 0 14px rgba(255,140,0,.8);animation:pulse 1.4s infinite}
.new{background:#22e37a;color:#032a14;left:auto;right:12px}
.rk{height:230px;background:radial-gradient(circle at 70% 40%,#5cc8ff 0,transparent 55%),linear-gradient(135deg,#1d4ed8,#3b82f6 50%,#6d28d9);box-shadow:0 8px 40px rgba(47,123,255,.45);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 60px rgba(47,123,255,.85)}}
.rk .txt{position:absolute;left:16px;bottom:16px}
.rkt{position:absolute;right:26px;top:46px;font-size:112px;line-height:1;transform:rotate(-8deg);filter:drop-shadow(0 14px 14px rgba(0,0,40,.55)) drop-shadow(0 0 30px rgba(120,200,255,.8));animation:fly 3.2s ease-in-out infinite}
@keyframes fly{50%{transform:rotate(-3deg) translateY(-12px)}}
.stars{position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 60% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 75%,#fff,transparent);opacity:.7}
.mb{position:absolute;z-index:2;animation:bob 3.4s ease-in-out infinite}
.mb span{display:block;background:linear-gradient(135deg,#2cf08a,#12a85a);color:#032a14;font-weight:800;font-size:14px;padding:5px 11px;border-radius:14px;box-shadow:0 0 16px rgba(34,227,122,.75);animation:popin .45s}
.mb:nth-of-type(1){top:44px;left:22px}
.mb:nth-of-type(2){top:70px;right:14px;animation-delay:-1.1s;animation-duration:4s}
.mb:nth-of-type(3){bottom:62px;right:92px;animation-delay:-2s;animation-duration:3s}
@keyframes bob{25%{transform:translate(8px,-10px)}50%{transform:translate(-6px,-4px)}75%{transform:translate(5px,8px)}}
@keyframes popin{from{transform:scale(.5);opacity:0}}
.pvp{height:112px;background:linear-gradient(135deg,#ff9a1f,#ffd23f);color:#2a1700;box-shadow:0 6px 24px rgba(255,170,30,.3)}
.pvp h3{text-shadow:none}
.vs{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font-size:40px}
.vs b{font-size:20px;background:#2a1700;color:var(--yellow);padding:4px 8px;border-radius:10px;animation:pulse 1.3s infinite}
.hub{height:130px;background:linear-gradient(135deg,#5b21b6,#9333ea 60%,#c026d3);box-shadow:0 6px 24px rgba(147,51,234,.35)}
.tiles{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:8px}
.tiles div{flex:1;background:rgba(0,0,0,.28);border-radius:14px;padding:7px 0;text-align:center;font-size:11px;font-weight:600}
.tiles i{display:block;font-style:normal;font-size:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:none}
.two .card{height:128px}
.f24{background:linear-gradient(135deg,#b8860b,#ffd23f 60%,#fff1a8);color:#3a2600}
.f24 h3{text-shadow:none}
.fr{background:linear-gradient(135deg,#be185d,#f472b6 70%,#fbcfe8)}
.ic{position:absolute;right:10px;bottom:6px;font-size:54px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:6px 0;transition:.2s}
nav button i{font-style:normal;font-size:22px}
nav button.act{color:var(--text)}nav button.act i{filter:drop-shadow(0 0 8px var(--blue))}
nav button:active{transform:scale(.9)}
/* game */
#game.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-12px,6px)}20%{transform:translate(10px,-8px)}30%{transform:translate(-9px,-6px)}40%{transform:translate(12px,5px)}50%{transform:translate(-8px,8px)}60%{transform:translate(7px,-5px)}80%{transform:translate(-4px,3px)}}
#flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:fl .6s}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px}
#back{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600}
#back:active{transform:scale(.92)}
.gh h2{flex:1;text-align:center;font-size:18px;text-shadow:0 0 14px var(--purple)}
.gh .pill{padding:7px 12px;font-size:14px}
#hist{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;min-height:36px;scrollbar-width:none}
#hist::-webkit-scrollbar{display:none}
.chip{flex:none;padding:4px 10px;border-radius:10px;font-weight:800;font-size:13px;background:rgba(255,59,92,.15);color:var(--red);border:1px solid rgba(255,59,92,.4);animation:chipin .35s}
.chip.g{background:rgba(34,227,122,.13);color:var(--green);border-color:rgba(34,227,122,.4)}
.none{color:var(--dim);font-size:12px;padding:6px 0}
@keyframes chipin{from{transform:scale(.3);opacity:0}}
#stage{position:relative;flex:none;height:290px;margin:0 12px;border-radius:20px;background:linear-gradient(180deg,#140c2b,#0e0820);border:1px solid var(--line);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#mw{position:absolute;left:0;right:0;top:25%;text-align:center;pointer-events:none}
#mult{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(124,58,237,.9)}
#mult.cd{color:var(--yellow);text-shadow:0 0 24px rgba(255,210,63,.7);animation:pulse 1s infinite}
#mult.hi{color:var(--green);text-shadow:0 0 24px var(--green)}
#mult.bad{color:var(--red);font-size:38px;text-shadow:0 0 26px var(--red)}
#sub{font-size:13px;color:var(--dim);margin-top:2px}
#you{margin:10px 12px 0;border:1px solid var(--purple)}
#list{flex:1;overflow-y:auto;padding:0 12px 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-top:6px;border-radius:12px;background:var(--panel);border-left:4px solid transparent;transition:background .3s,border-color .3s}
.row.new{animation:slide .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slide{from{transform:translateX(-60px);opacity:0}}
.row.win{background:#0c2b1c;border-left-color:var(--green)}
.row.lose{background:#2c0d17;border-left-color:var(--red)}
.row .av{width:34px;height:34px;font-size:18px;border-width:1px}
.row .nm{flex:1;display:flex;flex-direction:column;min-width:0}
.row small{color:var(--dim)}
.row .res{font-weight:800;font-size:13px}
.row.win .res{color:var(--green)}.row.lose .res{color:var(--red)}
.bar{padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
#act{width:100%;padding:17px;border-radius:16px;font-size:18px;font-weight:800;transition:transform .12s,background .2s}
#act:active:not(:disabled){transform:scale(.96)}
#act.yel{background:var(--yellow);color:#241a00}
#act.red{background:var(--red)}
#act.grn{background:var(--green);color:#03210f}
#act.pulse{animation:cash .8s infinite}
@keyframes cash{0%,100%{box-shadow:0 0 0 0 rgba(34,227,122,.7)}50%{box-shadow:0 0 0 14px rgba(34,227,122,0)}}
#act:disabled{background:var(--panel);color:var(--dim);cursor:default}
#back2{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
#back2.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#1a1230;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:61;border-top:1px solid var(--purple)}
#sheet.on{transform:none}
#sheet h3{margin-bottom:12px}
#amt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;font:800 22px Inter,sans-serif;color:var(--text);outline:0}
#amt:focus{border-color:var(--blue);box-shadow:0 0 12px rgba(47,123,255,.4)}
.q{display:flex;gap:8px;margin:12px 0}
.q button{flex:1;padding:11px 0;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.q button:active{transform:scale(.92);background:var(--purple)}
#err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
#ok{width:100%;padding:15px;border-radius:14px;background:linear-gradient(90deg,var(--purple),var(--blue));font-weight:800;font-size:16px}
#ok:active{transform:scale(.96)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--purple);padding:10px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:70;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* win screen */
#win{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7vh) 20px calc(env(safe-area-inset-bottom) + 20px);background:radial-gradient(90% 55% at 50% 0%,#3a1d8f 0,transparent 70%),radial-gradient(80% 50% at 100% 100%,#1b3fbf 0,transparent 70%),linear-gradient(180deg,#120a33,#070418);transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .4s;overflow:hidden}
#win.on{transform:none;opacity:1;pointer-events:auto}
#win::before,#win::after{content:"";position:absolute;inset:0;animation:tw 3s ease-in-out infinite}
#win::before{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#bcd,transparent),radial-gradient(2px 2px at 150px 60px,#fff,transparent);background-size:180px 160px}
#win::after{background-image:radial-gradient(1px 1px at 40px 90px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 20px,#cbf,transparent);background-size:130px 140px;animation-delay:-1.5s}
@keyframes tw{50%{opacity:.25}}
.ast{position:absolute;right:-6px;bottom:96px;z-index:1;font-size:150px;line-height:1;transform:rotate(-14deg);filter:drop-shadow(0 16px 20px rgba(0,0,40,.6)) drop-shadow(0 0 36px rgba(120,160,255,.7));animation:fly 4s ease-in-out infinite}
.wc{position:relative;z-index:2;width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;align-items:center}
.wbadge{background:rgba(139,92,246,.25);border:1px solid rgba(167,139,250,.6);padding:7px 16px;border-radius:20px;font-weight:600;backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(124,58,237,.5);animation:wpop .6s .1s both}
#wm{font-size:clamp(64px,22vw,96px);font-weight:800;line-height:1;margin:14px 0 22px;color:#fff;-webkit-text-stroke:3px #7c3aed;paint-order:stroke fill;text-shadow:0 0 30px #8b5cf6,0 0 70px #3b82f6;animation:wpop .7s cubic-bezier(.2,1.6,.4,1) .25s both}
.ncard{width:230px;padding:10px 10px 12px;border-radius:30px;background:linear-gradient(145deg,var(--c),#2a1a6e);box-shadow:0 0 50px var(--c),inset 0 0 0 2px rgba(255,255,255,.25);text-align:center;animation:wpop .7s .4s both}
.nimg{position:relative;width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:96px}
.nimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.npill{display:inline-block;position:relative;margin:-18px 0 4px;background:#0b0716;border:1px solid rgba(255,255,255,.3);padding:8px 18px;border-radius:20px;font-weight:800;font-size:17px;box-shadow:0 0 16px rgba(0,0,0,.5)}
.nname{font-size:12px;opacity:.9;font-weight:600}
.wbtn{margin-top:auto;display:flex;gap:12px;width:100%;animation:wpop .6s .7s both}
.wbtn button{flex:1;padding:16px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .12s}
.wbtn button:active{transform:scale(.95)}
#wb{background:rgba(10,6,30,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
#wp{background:linear-gradient(135deg,#8b5cf6,#2f7bff);box-shadow:0 0 28px rgba(99,102,241,.8);animation:wg 1.6s ease-in-out infinite}
@keyframes wg{50%{box-shadow:0 0 46px rgba(99,102,241,1)}}
@keyframes wpop{from{transform:scale(.6) translateY(20px);opacity:0}}
.cf{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;z-index:3;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="flash"></div>
<div id="toast"></div>

<section id="lobby" class="screen on">
  <div class="top"><div class="av" id="av1"></div><div class="who"><b id="un1"></b><small>Balance</small></div><div class="pill">💎 <span class="bal">1000.00</span></div><button id="dep" data-t="Deposit">Deposit</button></div>
  <div class="live"><span class="lv"><i></i>Live</span><div class="mq"><div class="trk" id="trk"></div></div></div>
  <div class="cards">
    <button id="play" class="card rk">
      <div class="stars"></div><span class="badge hot">HOT</span>
      <div class="mb"><span>x3.01</span></div><div class="mb"><span>x2.18</span></div><div class="mb"><span>x1.11</span></div>
      <div class="rkt">🚀</div>
      <div class="txt"><h3>ROCKET</h3><p>Cash out before it crashes</p></div>
    </button>
    <button class="card pvp" data-t="PVP HUB"><span class="badge new">NEW</span><h3 style="margin-top:22px">PVP HUB</h3><p style="color:#5a3a00">Duels for real prizes</p><div class="vs" style="top:60%">🥷<b>VS</b>🤺</div></button>
    <button class="card hub" data-t="PLAY HUB"><h3>PLAY HUB</h3><div class="tiles"><div><i>⬆️</i>Upgrader</div><div><i>🔴</i>Plinko</div><div><i>💣</i>Mines</div></div></button>
    <div class="two">
      <button class="card f24" data-t="FREE24"><h3>FREE24</h3><p>Daily gift</p><div class="ic">💍</div></button>
      <button class="card fr" data-t="FREE"><h3>FREE</h3><p>Claim a gift</p><div class="ic">🪖</div></button>
    </div>
  </div>
  <nav>
    <button data-t="Backpack"><i>🎒</i>Backpack</button>
    <button data-t="Invite"><i>👥</i>Invite</button>
    <button class="act"><i>🏠</i>Home</button>
    <button data-t="Leaderboard"><i>🏆</i>Leaderboard</button>
    <button data-t="Earn"><i>💰</i>Earn</button>
  </nav>
</section>

<section id="game" class="screen">
  <div class="gh"><button id="back">‹ Back</button><h2>CrashX</h2><div class="pill">💎 <span class="bal">1000.00</span></div></div>
  <div id="hist"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="mw"><div id="mult">1.00x</div><div id="sub"></div></div>
  </div>
  <div id="you" class="row"></div>
  <div id="list"></div>
  <div class="bar"><button id="act" disabled>Place Bet</button></div>
</section>

<div id="win">
  <div class="ast">🧑‍🚀</div>
  <div class="wc">
    <div class="wbadge" id="wn"></div>
    <div id="wm">1.00x</div>
    <div class="ncard" id="nc">
      <div class="nimg"><span id="nem">🎁</span><img id="nimg" alt=""></div>
      <div class="npill" id="npill"></div>
      <div class="nname" id="nname"></div>
    </div>
    <div class="wbtn"><button id="wb">Back</button><button id="wp">Play Rocket</button></div>
  </div>
</div>

<div id="back2"></div>
<div id="sheet">
  <h3>Place your bet</h3>
  <input id="amt" type="number" inputmode="decimal" min="1" max="10000" placeholder="Amount (max 10,000)">
  <div class="q"><button data-v="10">10</button><button data-v="100">100</button><button data-v="500">500</button><button data-v="max">Max</button></div>
  <div id="err"></div>
  <button id="ok">Confirm bet</button>
</div>

<script>
(()=>{
const tg=window.Telegram&&Telegram.WebApp,$=i=>document.getElementById(i);
try{tg.ready();tg.expand();tg.setHeaderColor('#0b0716');tg.setBackgroundColor('#0b0716')}catch(e){}
const imp=s=>{try{tg.HapticFeedback.impactOccurred(s||'light')}catch(e){}},note=s=>{try{tg.HapticFeedback.notificationOccurred(s)}catch(e){}};
const EM=['🚀','💎','⭐','🛸','👑','🔥'],NAMES=['Nova','Viper','Ghost','Blaze','Orion','Zephyr','Raven','Titan','Echo','Comet'],AVS=['🦊','🐺','🐲','🦅','🐙','🦄','🐯','🤖'];
const MAXBET=10000,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],f2=n=>n.toFixed(2),D=n=>'💎 '+f2(n);
let balance=1000,hist=[],state='idle',m=1,crash=2,emoji='🚀',bet=null,fakes=[],rid=0,last=0,cd=10,started=false,W=0,H=0;
const user=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,uname=(user&&user.first_name)||'Player';

/* toast */
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}

/* profile + balance */
function setAv(el){el.textContent='';if(user&&user.photo_url){const i=new Image();i.src=user.photo_url;i.onerror=()=>{el.textContent=uname[0]};el.appendChild(i)}else el.textContent=uname[0].toUpperCase()}
setAv($('av1'));$('un1').textContent=uname;
function setBal(){document.querySelectorAll('.bal').forEach(e=>e.textContent=f2(balance))}

/* lobby: live bar + floating multiplier badges */
const LV=['🐒','🔮','📦','🍄','❤️','🪔','💎','👑'];
let lh='';for(let k=0;k<2;k++)LV.forEach(e=>{lh+='<span>'+e+'<em>+'+f2(rnd(1,40))+'</em></span>'});
$('trk').innerHTML=lh;
const rv=()=>'x'+(Math.random()<.6?rnd(1.05,3.5):rnd(3.5,12)).toFixed(2);
document.querySelectorAll('.mb span').forEach((s,i)=>{
 const set=()=>{const c=s.cloneNode(false);c.textContent=rv();s.replaceWith(c);s=c};
 setInterval(set,2400+i*900);
});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{imp();toast(b.dataset.t+' is coming soon')});

/* rows */
function mk(e,av,name){e.innerHTML='<div class="av"></div><div class="nm"><b></b><small></small></div><div class="res"></div>';const a=e.querySelector('.av');if(av)a.textContent=av;else setAv(a);e.querySelector('b').textContent=name;return e}
function setRow(e,cls,b,r){e.classList.remove('win','lose');if(cls)e.classList.add(cls);e.querySelector('small').textContent=b;e.querySelector('.res').textContent=r}
const you=mk($('you'),null,'You');
function renderYou(){
 if(!bet)setRow(you,'','No bet','—');
 else if(bet.st==='active')setRow(you,'',D(bet.amt),'In play');
 else if(bet.st==='won')setRow(you,'win',D(bet.amt),'💎 +'+f2(bet.win)+' ('+f2(bet.at)+'x)');
 else setRow(you,'lose',D(bet.amt),'Lost');
}
function addFake(){
 const used=fakes.map(f=>f.name),name=pick(NAMES.filter(n=>!used.includes(n)));if(!name)return;
 const f={name,amt:Math.floor(Math.random()*99)+2,target:+(1.15+Math.pow(Math.random(),1.6)*7).toFixed(2),st:'bet'};
 f.el=mk(document.createElement('div'),pick(AVS),name);f.el.className='row fake new';
 setRow(f.el,'',D(f.amt),'—');$('list').prepend(f.el);fakes.push(f);
}

/* history */
function renderHist(){
 const h=$('hist');h.innerHTML='';
 if(!hist.length){h.innerHTML='<span class="none">No rounds yet</span>';return}
 hist.forEach((v,i)=>{const c=document.createElement('span');c.className='chip'+(v>=2?' g':'');c.textContent=f2(v)+'x';if(i)c.style.animation='none';h.appendChild(c)});
}

/* display */
function setMult(){
 const e=$('mult'),s=$('sub');
 if(state==='cd'){e.className='cd';e.textContent=cd;s.textContent='Place your bets'}
 else{e.className=m>=2?'hi':'';e.textContent=f2(m)+'x';s.textContent='Flying '+emoji}
}
function updateBtn(){
 const b=$('act');b.disabled=false;b.className='';
 if(state==='cd'){
  if(!bet){b.className='yel';b.textContent='Place Bet';b.dataset.a='bet'}
  else{b.className='red';b.textContent='Cancel · '+D(bet.amt);b.dataset.a='cancel'}
 }else if(state==='fl'&&bet&&bet.st==='active'){b.className='grn pulse';b.textContent='Cash Out '+D(bet.amt*m);b.dataset.a='cash'}
 else{b.disabled=true;b.textContent=bet&&bet.st==='won'?'Cashed Out':state==='cr'?'Crashed':'Round in progress'}
}

/* canvas: path starts bottom-left, curves to top-right */
const cv=$('cv'),x=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);draw(performance.now())}
window.addEventListener('resize',resize);
const PAD=30,P=t=>({x:PAD+t*(W-2*PAD),y:H-PAD-Math.pow(t,2.3)*(H-2*PAD)});
function draw(ts){
 if(!W)return;x.clearRect(0,0,W,H);x.shadowBlur=0;
 x.strokeStyle='rgba(124,58,237,.14)';x.lineWidth=1;
 for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,H*i/5);x.lineTo(W,H*i/5);x.stroke()}
 const idle=state==='cd',u=idle?0:Math.min(Math.log(m)/Math.log(12),1),n=60,o=P(0),e=P(u);
 if(!idle){
  x.beginPath();x.moveTo(o.x,o.y);for(let i=1;i<=n;i++){const p=P(u*i/n);x.lineTo(p.x,p.y)}
  x.lineTo(e.x,H-PAD);x.lineTo(o.x,H-PAD);x.closePath();
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,59,92,.38)');g.addColorStop(1,'rgba(255,59,92,0)');x.fillStyle=g;x.fill();
  x.beginPath();x.moveTo(o.x,o.y);for(let i=1;i<=n;i++){const p=P(u*i/n);x.lineTo(p.x,p.y)}
  x.strokeStyle='#ff3b5c';x.lineWidth=4;x.lineCap='round';x.shadowColor='#ff3b5c';x.shadowBlur=16;x.stroke();
 }
 if(state==='cd'||state==='fl'){
  const q=P(Math.max(u-.03,0)),ang=u>0?Math.atan2(e.y-q.y,e.x-q.x):-.15,wob=(state==='fl'&&u>=1)?Math.sin(ts/110)*5:0;
  x.save();x.translate(e.x,e.y+wob);
  x.rotate(emoji==='🚀'?ang+Math.PI/4:ang*.5); /* rocket nose follows the path; others tilt slightly */
  x.shadowColor='#fff';x.shadowBlur=idle?8:22;x.font='34px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText(emoji,0,0);x.restore();
 }
 x.shadowBlur=0;
}

/* round flow */
function startRound(){
 const id=++rid;state='cd';cd=10;m=1;bet=null;emoji=pick(EM);
 document.querySelectorAll('.fake').forEach(e=>e.remove());fakes=[];
 setMult();renderYou();updateBtn();draw(performance.now());
 const n=Math.floor(rnd(3,6));
 for(let i=0;i<n;i++)setTimeout(()=>{if(id===rid&&state==='cd')addFake()},rnd(300,7000));
 const t=setInterval(()=>{
  if(id!==rid)return clearInterval(t);
  cd--;if(cd<=0){clearInterval(t);flight()}else setMult();
 },1000);
}
function flight(){
 const r=Math.random();
 crash=r<.5?rnd(1.05,1.99):r<.8?rnd(2,5):5+Math.pow(Math.random(),2)*25;
 state='fl';last=performance.now();setMult();updateBtn();requestAnimationFrame(loop);
}
function loop(ts){
 if(state!=='fl')return;
 const dt=Math.min((ts-last)/1000,.1);last=ts;
 m+=0.12*Math.max(1,m/2)*dt; /* very slow start; accelerates with the multiplier after 2.00x */
 if(m>=crash){m=crash;return boom()}
 fakes.forEach(f=>{if(f.st==='bet'&&m>=f.target){f.st='won';setRow(f.el,'win',D(f.amt),'💎 +'+f2(f.amt*f.target)+' ('+f2(f.target)+'x)')}});
 setMult();draw(ts);
 if(bet&&bet.st==='active')updateBtn();
 requestAnimationFrame(loop);
}
function boom(){
 state='cr';
 const e=$('mult');e.className='bad';e.textContent='CRASHED!';$('sub').textContent='at '+f2(crash)+'x';
 hist.unshift(crash);hist=hist.slice(0,30);renderHist();
 if(bet&&bet.st==='active'){bet.st='lost';renderYou()}
 fakes.forEach(f=>{if(f.st==='bet'){f.st='lost';setRow(f.el,'lose',D(f.amt),'Lost')}});
 draw(performance.now());updateBtn();
 const g=$('game');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
 const fl=$('flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
 note('error');
 const id=rid;setTimeout(()=>{if(id===rid&&state==='cr')startRound()},3500);
}

/* actions */
$('act').onclick=()=>{
 const a=$('act').dataset.a;imp('medium');
 if(a==='bet')openSheet();
 else if(a==='cancel'&&state==='cd'&&bet){balance+=bet.amt;bet=null;setBal();renderYou();updateBtn()}
 else if(a==='cash'&&state==='fl'&&bet&&bet.st==='active'){
  bet.st='won';bet.at=m;bet.win=bet.amt*m;balance+=bet.win;setBal();renderYou();updateBtn();note('success');showWin();
 }
};
function openSheet(){
 $('err').textContent='';$('amt').value=Math.min(100,Math.floor(balance))||'';
 $('back2').classList.add('on');$('sheet').classList.add('on');
}
function closeSheet(){$('back2').classList.remove('on');$('sheet').classList.remove('on');$('amt').blur()}
$('back2').onclick=closeSheet;
document.querySelectorAll('.q button').forEach(b=>b.onclick=()=>{
 imp();const v=b.dataset.v;
 $('amt').value=v==='max'?Math.floor(Math.min(balance,MAXBET)*100)/100:v;
});
$('ok').onclick=()=>{
 const v=parseFloat($('amt').value),er=$('err');
 if(!(v>=1))return er.textContent='Enter at least 💎 1.';
 if(v>MAXBET)return er.textContent='Max bet is 💎 10,000.';
 if(v>balance)return er.textContent='Not enough balance.';
 if(state!=='cd'){closeSheet();return}
 imp('heavy');balance-=v;bet={amt:v,st:'active'};setBal();renderYou();updateBtn();closeSheet();
};

/* NFT rewards: highest tier whose min multiplier is reached. Replace img URLs with real NFT images. */
const NFTS=[
 {name:'Bronze Gift',tier:'Common',min:1.0,c:'#cd7f32',em:'🎁',img:'https://picsum.photos/seed/bronze-gift/400'},
 {name:'Silver Heart',tier:'Rare',min:1.5,c:'#8fa8ff',em:'💝',img:'https://picsum.photos/seed/silver-heart/400'},
 {name:'Golden Pepe',tier:'Epic',min:3.0,c:'#ffb81c',em:'🐸',img:'https://picsum.photos/seed/golden-pepe/400'}
];
const nftFor=v=>NFTS.reduce((a,n)=>v>=n.min?n:a,NFTS[0]);
function showWin(){
 const n=nftFor(bet.at),im=$('nimg');
 $('wn').textContent=uname+' won:';$('wm').textContent=f2(bet.at)+'x';
 $('nc').style.setProperty('--c',n.c);$('nem').textContent=n.em;
 im.style.display='';im.onerror=()=>{im.style.display='none'};im.src=n.img;
 $('npill').textContent=f2(bet.win)+' 💎';$('nname').textContent=n.name+' · '+n.tier;
 const w=$('win');w.querySelectorAll('.cf').forEach(e=>e.remove());
 const cols=['#ffd23f','#22e37a','#8b5cf6','#2f7bff','#ff3b5c','#fff'];
 for(let i=0;i<44;i++){const c=document.createElement('i');c.className='cf';c.style.cssText='left:'+rnd(0,100)+'%;background:'+pick(cols)+';animation-duration:'+rnd(2.4,5)+'s;animation-delay:'+rnd(0,1.6)+'s';w.appendChild(c)}
 w.classList.add('on');note('success');
}
function closeWin(){$('win').classList.remove('on')}
/* the round keeps running behind the overlay, so bots finish as normal */
$('wb').onclick=()=>{imp();closeWin();$('game').classList.remove('on');$('lobby').classList.add('on')};
$('wp').onclick=()=>{imp('medium');closeWin();startRound()};

/* navigation */
$('play').onclick=()=>{
 imp('medium');$('lobby').classList.remove('on');$('game').classList.add('on');
 resize();renderHist();
 if(!started){started=true;startRound()}
};
$('back').onclick=()=>{imp();$('game').classList.remove('on');$('lobby').classList.add('on')};
setBal();renderYou();
})();
</script>
</body>
</html>
