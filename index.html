<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CrashX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0716;--panel:#161027;--line:#2a1f4a;--purple:#7c3aed;--blue:#2f7bff;--green:#22e37a;--red:#ff3b5c;--yellow:#ffd23f;--text:#f1ecff;--dim:#8d82b3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;user-select:none}
body{background:radial-gradient(120% 60% at 50% 0%,#24104f 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{display:none;position:absolute;inset:0;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.on{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.pill{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:800;box-shadow:0 0 14px rgba(124,58,237,.35);white-space:nowrap}
.uname{font-weight:600}
/* lobby */
#lobby .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.5px;text-shadow:0 0 18px var(--purple)}
.logo b{color:var(--blue)}
#play{position:relative;width:230px;height:250px;border-radius:32px;background:linear-gradient(160deg,#5ea0ff,#2f55ff 55%,#5b2fe0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;animation:glow 2s ease-in-out infinite;transition:transform .15s}
#play:active{transform:scale(.94)}
#play .r{font-size:96px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));animation:float 3s ease-in-out infinite}
#play .t{font-weight:800;font-size:22px;letter-spacing:1px}
#play small{opacity:.85}
.hot{position:absolute;top:-10px;right:-10px;background:var(--red);font-weight:800;font-size:12px;padding:5px 10px;border-radius:12px;box-shadow:0 0 14px var(--red);animation:pulse 1.2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 25px rgba(47,123,255,.5),0 0 60px rgba(124,58,237,.25)}50%{box-shadow:0 0 50px rgba(47,123,255,.9),0 0 110px rgba(124,58,237,.5)}}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes pulse{50%{transform:scale(1.12)}}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim);padding:6px 0;transition:.2s}
nav button i{font-style:normal;font-size:22px}
nav button.act{color:var(--text)}
nav button.act i{filter:drop-shadow(0 0 8px var(--blue))}
nav button:active{transform:scale(.9)}
/* game */
#game{position:absolute}
#game.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-12px,6px)}20%{transform:translate(10px,-8px)}30%{transform:translate(-9px,-6px)}40%{transform:translate(12px,5px)}50%{transform:translate(-8px,8px)}60%{transform:translate(7px,-5px)}80%{transform:translate(-4px,3px)}}
#flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:fl .6s}
@keyframes fl{0%{opacity:.45}100%{opacity:0}}
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px}
#back{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600}
#back:active{transform:scale(.92)}
.gh h2{flex:1;text-align:center;font-size:17px}
.gh .pill{margin:0;padding:7px 12px;font-size:14px}
#hist{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;min-height:36px;scrollbar-width:none}
#hist::-webkit-scrollbar{display:none}
.chip{flex:none;padding:4px 10px;border-radius:10px;font-weight:800;font-size:13px;background:rgba(255,59,92,.15);color:var(--red);border:1px solid rgba(255,59,92,.4);animation:chipin .35s}
.chip.g{background:rgba(34,227,122,.13);color:var(--green);border-color:rgba(34,227,122,.4)}
.none{color:var(--dim);font-size:12px;padding:6px 0}
@keyframes chipin{from{transform:scale(.3);opacity:0}}
#stage{position:relative;flex:none;height:290px;margin:0 12px;border-radius:20px;background:linear-gradient(180deg,#140c2b,#0e0820);border:1px solid var(--line);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#circle{position:absolute;left:50%;top:50%;width:156px;height:156px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(11,7,22,.6);border:2px solid var(--purple);box-shadow:0 0 30px rgba(124,58,237,.5),inset 0 0 24px rgba(124,58,237,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(3px);transition:border-color .2s,box-shadow .2s}
#mult{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
#mult.cd{font-size:56px;color:var(--yellow);animation:pulse 1s infinite}
#mult.hi{color:var(--green);text-shadow:0 0 16px var(--green)}
#mult.bad{color:var(--red);font-size:25px;text-shadow:0 0 18px var(--red)}
#sub{font-size:12px;color:var(--dim);margin-top:2px}
#circle.bad{border-color:var(--red);box-shadow:0 0 40px rgba(255,59,92,.7)}
#you{margin:10px 12px 0}
#list{flex:1;overflow-y:auto;padding:0 12px 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-top:6px;border-radius:12px;background:var(--panel);border-left:4px solid transparent;transition:background .3s,border-color .3s}
.row.new{animation:slide .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slide{from{transform:translateX(-60px);opacity:0}}
.row.win{background:#0c2b1c;border-left-color:var(--green)}
.row.lose{background:#2c0d17;border-left-color:var(--red)}
.row .nm{flex:1;display:flex;flex-direction:column;min-width:0}
.row small{color:var(--dim)}
.row .res{font-weight:800;font-size:13px}
.row.win .res{color:var(--green)}.row.lose .res{color:var(--red)}
#you{border:1px solid var(--purple)}
.bar{padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
#act{width:100%;padding:17px;border-radius:16px;font-size:18px;font-weight:800;transition:transform .12s,background .2s}
#act:active:not(:disabled){transform:scale(.96)}
#act.yel{background:var(--yellow);color:#241a00}
#act.red{background:var(--red)}
#act.grn{background:var(--green);color:#03210f}
#act.pulse{animation:cash .8s infinite}
@keyframes cash{0%,100%{box-shadow:0 0 0 0 rgba(34,227,122,.7)}50%{box-shadow:0 0 0 14px rgba(34,227,122,0)}}
#act:disabled{background:var(--panel);color:var(--dim);cursor:default}
/* sheet */
#back2{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
#back2.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#1a1230;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:61;border-top:1px solid var(--purple)}
#sheet.on{transform:none}
#sheet h3{margin-bottom:12px}
#amt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;font:800 22px Inter,sans-serif;color:var(--text);outline:0}
#amt:focus{border-color:var(--blue);box-shadow:0 0 12px rgba(47,123,255,.4)}
.q{display:flex;gap:8px;margin:12px 0}
.q button{flex:1;padding:11px 0;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.q button:active{transform:scale(.92);background:var(--purple)}
#err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
#ok{width:100%;padding:15px;border-radius:14px;background:linear-gradient(90deg,var(--purple),var(--blue));font-weight:800;font-size:16px}
#ok:active{transform:scale(.96)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--purple);padding:10px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:70;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="flash"></div>
<div id="toast"></div>

<section id="lobby" class="screen on">
  <div class="top"><div class="av" id="av1"></div><span class="uname" id="un1"></span><div class="pill">💎 <span class="bal">1000.00</span></div></div>
  <div class="mid">
    <div class="logo">Crash<b>X</b></div>
    <button id="play"><span class="hot">HOT</span><span class="r">🚀</span><span class="t">ROCKET</span><small>Tap to play</small></button>
  </div>
  <nav>
    <button data-t="Backpack"><i>🎒</i>Backpack</button>
    <button data-t="Invite"><i>👥</i>Invite</button>
    <button class="act"><i>🏠</i>Home</button>
    <button data-t="Leaderboard"><i>🏆</i>Leaderboard</button>
    <button data-t="Earn"><i>💰</i>Earn</button>
  </nav>
</section>

<section id="game" class="screen">
  <div class="gh"><button id="back">‹ Back</button><h2>Epic Gift</h2><div class="pill">💎 <span class="bal">1000.00</span></div></div>
  <div id="hist"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="circle"><div id="mult">1.00x</div><div id="sub"></div></div>
  </div>
  <div id="you" class="row"></div>
  <div id="list"></div>
  <div class="bar"><button id="act" disabled>Place Bet</button></div>
</section>

<div id="back2"></div>
<div id="sheet">
  <h3>Place your bet</h3>
  <input id="amt" type="number" inputmode="decimal" min="1" max="10000" placeholder="Amount (max 10,000)">
  <div class="q"><button data-v="10">10</button><button data-v="100">100</button><button data-v="500">500</button><button data-v="max">Max</button></div>
  <div id="err"></div>
  <button id="ok">Confirm bet</button>
</div>

<script>
(()=>{
const tg=window.Telegram&&Telegram.WebApp,$=i=>document.getElementById(i);
try{tg.ready();tg.expand();tg.setHeaderColor('#0b0716');tg.setBackgroundColor('#0b0716')}catch(e){}
const imp=s=>{try{tg.HapticFeedback.impactOccurred(s||'light')}catch(e){}},note=s=>{try{tg.HapticFeedback.notificationOccurred(s)}catch(e){}};
const EM=['🚀','💎','⭐','🛸','👑','🔥'],NAMES=['Nova','Viper','Ghost','Blaze','Orion','Zephyr','Raven','Titan','Echo','Comet'],AVS=['🦊','🐺','🐲','🦅','🐙','🦄','🐯','🤖'];
const MAXBET=10000,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],f2=n=>n.toFixed(2),D=n=>'💎 '+f2(n);
let balance=1000,hist=[],state='idle',m=1,crash=2,emoji='🚀',bet=null,fakes=[],rid=0,last=0,cd=10,started=false,W=0,H=0;
const user=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,uname=(user&&user.first_name)||'Player';

/* profile */
function setAv(el){el.textContent='';if(user&&user.photo_url){const i=new Image();i.src=user.photo_url;i.onerror=()=>{el.textContent=uname[0]};el.appendChild(i)}else el.textContent=uname[0].toUpperCase()}
setAv($('av1'));$('un1').textContent=uname;
function setBal(){document.querySelectorAll('.bal').forEach(e=>e.textContent=f2(balance))}

/* rows */
function mk(e,av,name){e.innerHTML='<div class="av"></div><div class="nm"><b></b><small></small></div><div class="res"></div>';const a=e.querySelector('.av');if(av)a.textContent=av;else setAv(a);e.querySelector('b').textContent=name;return e}
function setRow(e,cls,b,r){e.classList.remove('win','lose');if(cls)e.classList.add(cls);e.querySelector('small').textContent=b;e.querySelector('.res').textContent=r}
const you=mk($('you'),null,'You');
function renderYou(){
 if(!bet)setRow(you,'','No bet','—');
 else if(bet.st==='active')setRow(you,'',D(bet.amt),'In play');
 else if(bet.st==='won')setRow(you,'win',D(bet.amt),'💎 +'+f2(bet.win)+' ('+f2(bet.at)+'x)');
 else setRow(you,'lose',D(bet.amt),'Lost');
}
function addFake(){
 const used=fakes.map(f=>f.name),name=pick(NAMES.filter(n=>!used.includes(n)));if(!name)return;
 const f={name,amt:Math.round(rnd(10,2500)/10)*10,target:+(1.15+Math.pow(Math.random(),1.6)*7).toFixed(2),st:'bet'};
 f.el=mk(document.createElement('div'),pick(AVS),name);f.el.className='row fake new';
 setRow(f.el,'',D(f.amt),'—');$('list').prepend(f.el);fakes.push(f);
}

/* history */
function renderHist(){
 const h=$('hist');h.innerHTML='';
 if(!hist.length){h.innerHTML='<span class="none">No rounds yet</span>';return}
 hist.forEach((v,i)=>{const c=document.createElement('span');c.className='chip'+(v>=2?' g':'');c.textContent=f2(v)+'x';if(i)c.style.animation='none';h.appendChild(c)});
}

/* display */
function setMult(){
 const e=$('mult'),s=$('sub');$('circle').className='';
 if(state==='cd'){e.className='cd';e.textContent=cd;s.textContent='Place your bets'}
 else{e.className=m>=2?'hi':'';e.textContent=f2(m)+'x';s.textContent='Flying '+emoji}
}
function updateBtn(){
 const b=$('act');b.disabled=false;b.className='';
 if(state==='cd'){
  if(!bet){b.className='yel';b.textContent='Place Bet';b.dataset.a='bet'}
  else{b.className='red';b.textContent='Cancel · '+D(bet.amt);b.dataset.a='cancel'}
 }else if(state==='fl'&&bet&&bet.st==='active'){b.className='grn pulse';b.textContent='Cash Out '+D(bet.amt*m);b.dataset.a='cash'}
 else{b.disabled=true;b.textContent=state==='fl'?(bet&&bet.st==='won'?'Cashed out '+D(bet.win):'Round in progress'):'Round over'}
}

/* canvas */
const cv=$('cv'),x=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);draw(performance.now())}
window.addEventListener('resize',resize);
const PAD=30,P=t=>({x:PAD+t*(W-2*PAD),y:H-PAD-Math.pow(t,1.7)*(H-2*PAD)});
function draw(ts){
 if(!W)return;x.clearRect(0,0,W,H);x.shadowBlur=0;
 x.strokeStyle='rgba(124,58,237,.14)';x.lineWidth=1;
 for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,H*i/5);x.lineTo(W,H*i/5);x.stroke()}
 const idle=state==='cd',u=idle?0:Math.min(Math.log(m)/Math.log(12),1),n=60;
 if(!idle){
  const e=P(u),o=P(0);
  x.beginPath();x.moveTo(o.x,o.y);for(let i=1;i<=n;i++){const p=P(u*i/n);x.lineTo(p.x,p.y)}
  x.lineTo(e.x,H-PAD);x.lineTo(o.x,H-PAD);x.closePath();
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,59,92,.28)');g.addColorStop(1,'rgba(255,59,92,0)');x.fillStyle=g;x.fill();
  x.beginPath();x.moveTo(o.x,o.y);for(let i=1;i<=n;i++){const p=P(u*i/n);x.lineTo(p.x,p.y)}
  x.strokeStyle='#ff3b5c';x.lineWidth=4;x.lineCap='round';x.shadowColor='#ff3b5c';x.shadowBlur=16;x.stroke();
 }
 if(state==='cd'||state==='fl'){
  const p=P(u),wob=(state==='fl'&&u>=1)?Math.sin(ts/110)*5:0;
  x.shadowColor='#fff';x.shadowBlur=idle?8:22;x.font='34px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText(emoji,p.x,p.y+wob);
 }
 x.shadowBlur=0;
}

/* round flow */
function startRound(){
 const id=++rid;state='cd';cd=10;m=1;bet=null;emoji=pick(EM);
 document.querySelectorAll('.fake').forEach(e=>e.remove());fakes=[];
 setMult();renderYou();updateBtn();draw(performance.now());
 const n=Math.floor(rnd(3,6));
 for(let i=0;i<n;i++)setTimeout(()=>{if(id===rid&&state==='cd')addFake()},rnd(300,7000));
 const t=setInterval(()=>{
  if(id!==rid)return clearInterval(t);
  cd--;if(cd<=0){clearInterval(t);flight()}else setMult();
 },1000);
}
function flight(){
 const r=Math.random();
 crash=r<.5?rnd(1.05,1.99):r<.8?rnd(2,5):5+Math.pow(Math.random(),2)*25;
 state='fl';last=performance.now();setMult();updateBtn();requestAnimationFrame(loop);
}
function loop(ts){
 if(state!=='fl')return;
 const dt=Math.min((ts-last)/1000,.1);last=ts;
 m+=0.12*Math.max(1,m/2)*dt; /* slow start; speed scales with multiplier once past 2.00x */
 if(m>=crash){m=crash;return boom()}
 fakes.forEach(f=>{if(f.st==='bet'&&m>=f.target){f.st='won';setRow(f.el,'win',D(f.amt),'💎 +'+f2(f.amt*f.target)+' ('+f2(f.target)+'x)')}});
 setMult();draw(ts);
 if(bet&&bet.st==='active')updateBtn();
 requestAnimationFrame(loop);
}
function boom(){
 state='cr';
 const e=$('mult');e.className='bad';e.textContent='CRASHED!';$('sub').textContent='at '+f2(crash)+'x';$('circle').className='bad';
 hist.unshift(crash);hist=hist.slice(0,30);renderHist();
 if(bet&&bet.st==='active'){bet.st='lost';renderYou()}
 fakes.forEach(f=>{if(f.st==='bet'){f.st='lost';setRow(f.el,'lose',D(f.amt),'Lost')}});
 draw(performance.now());updateBtn();
 const g=$('game');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
 const fl=$('flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
 note('error');
 const id=rid;setTimeout(()=>{if(id===rid&&state==='cr')startRound()},3500);
}

/* actions */
$('act').onclick=()=>{
 const a=$('act').dataset.a;imp('medium');
 if(a==='bet')openSheet();
 else if(a==='cancel'&&state==='cd'&&bet){balance+=bet.amt;bet=null;setBal();renderYou();updateBtn()}
 else if(a==='cash'&&state==='fl'&&bet&&bet.st==='active'){
  bet.st='won';bet.at=m;bet.win=bet.amt*m;balance+=bet.win;setBal();renderYou();updateBtn();note('success');
 }
};
function openSheet(){
 $('err').textContent='';$('amt').value=Math.min(100,Math.floor(balance))||'';
 $('back2').classList.add('on');$('sheet').classList.add('on');
}
function closeSheet(){$('back2').classList.remove('on');$('sheet').classList.remove('on');$('amt').blur()}
$('back2').onclick=closeSheet;
document.querySelectorAll('.q button').forEach(b=>b.onclick=()=>{
 imp();const v=b.dataset.v;
 $('amt').value=v==='max'?Math.floor(Math.min(balance,MAXBET)*100)/100:v;
});
$('ok').onclick=()=>{
 const v=parseFloat($('amt').value),er=$('err');
 if(!(v>=1))return er.textContent='Enter at least 💎 1.';
 if(v>MAXBET)return er.textContent='Max bet is 💎 10,000.';
 if(v>balance)return er.textContent='Not enough balance.';
 if(state!=='cd'){closeSheet();return}
 imp('heavy');balance-=v;bet={amt:v,st:'active'};setBal();renderYou();updateBtn();closeSheet();
};

/* navigation */
$('play').onclick=()=>{
 imp('medium');$('lobby').classList.remove('on');$('game').classList.add('on');
 resize();renderHist();
 if(!started){started=true;startRound()}
};
$('back').onclick=()=>{imp();$('game').classList.remove('on');$('lobby').classList.add('on')};
let tt;
document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{
 imp();const t=$('toast');t.textContent=b.dataset.t+' is coming soon';t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600);
});
setBal();renderYou();
})();
</script>
</body>
</html>
