<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { 
            background-color: #14151a; 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Top Bar */
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px; 
            background: #14151a; 
            position: relative;
            z-index: 10;
        }
        .back-btn { display: flex; align-items: center; gap: 5px; background: #000; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .title { display: flex; align-items: center; gap: 8px; background: #2a2b36; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .balance-box { display: flex; align-items: center; gap: 8px; background: #2a2b36; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: 700; }
        .balance-box span { color: #60a5fa; }

        /* Game Area */
        .game-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            position: relative;
        }

        .rocket-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s linear;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
        }
        .rocket-container.flying {
            opacity: 1;
            animation: fly 0.5s infinite alternate;
        }
        .rocket-icon { font-size: 50px; transform: rotate(45deg); }

        @keyframes fly {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            100% { transform: translate(-50%, -50%) translateY(-10px); }
        }

        .circle-display {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #fbbf24;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: 800;
            color: white;
            position: relative;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.1);
            transition: all 0.3s ease;
        }
        
        .circle-display.countdown {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }
        
        .circle-display.crashed {
            border-color: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
            color: #ef4444;
            font-size: 28px;
            text-align: center;
        }

        .multiplier-history {
            display: flex;
            gap: 8px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 15px;
        }
        .hist-pill {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
            background: #1e1f26;
            border: 1px solid #333;
        }
        .hist-pill.red { border-color: #ef4444; color: #ef4444; }
        .hist-pill.green { border-color: #10b981; color: #10b981; }
        .hist-pill.blue { border-color: #3b82f6; color: #3b82f6; }

        /* Controls Area */
        .controls { 
            padding: 15px; 
            background: #1e1f26; 
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        
        .action-btn { 
            width: 100%; 
            padding: 20px; 
            border: none; 
            border-radius: 15px; 
            font-size: 20px; 
            font-weight: 800; 
            color: white; 
            cursor: pointer; 
            transition: 0.1s; 
            background: linear-gradient(90deg, #0ea5e9, #3b82f6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn.cashout { 
            background: linear-gradient(90deg, #10b981, #059669); 
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); 
        }
        .action-btn:disabled { 
            background: #2a2b36; 
            box-shadow: none; 
            color: #555; 
            cursor: not-allowed; 
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 5px 20px 5px;
            background: #14151a;
            font-size: 10px;
            color: #666;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: white; }
        .nav-icon { font-size: 20px; }

        /* Bet Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }
        .modal-content {
            background: #1e1f26;
            width: 100%;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .modal-content.show { transform: translateY(0); }
        .modal-title { text-align: center; font-size: 18px; font-weight: 700; color: white; margin-bottom: 10px; }
        
        .bet-input {
            width: 100%;
            padding: 20px;
            background: #14151a;
            border: 1px solid #333;
            border-radius: 15px;
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }
        .bet-input:focus { border-color: #3b82f6; }
        
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-cancel { background: #2a2b36; color: white; }
        .btn-confirm { background: #3b82f6; color: white; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="back-btn">← Back</div>
        <div class="title">🎁 Epic Gift</div>
        <div class="balance-box">
            <span>💎</span> <span id="balance">1000.00</span>
        </div>
    </div>

    <!-- Game Area -->
    <div class="game-area">
        <div class="rocket-container" id="rocket">
            <div class="rocket-icon">🚀</div>
        </div>
        
        <div class="circle-display" id="circle">
            <span id="multiplier-text">1.00x</span>
        </div>

        <div class="multiplier-history">
            <div class="hist-pill red">1.02x</div>
            <div class="hist-pill blue">2.45x</div>
            <div class="hist-pill green">1.37x</div>
            <div class="hist-pill red">1.04x</div>
            <div class="hist-pill blue">4.76x</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="action-btn" id="action-btn" onclick="handleAction()">Place bet</button>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item"><div class="nav-icon">📦</div>Backpack</div>
        <div class="nav-item"><div class="nav-icon">👥</div>Invite</div>
        <div class="nav-item active"><div class="nav-icon">🏠</div>Home</div>
        <div class="nav-item"><div class="nav-icon">🏆</div>Leaderboard</div>
        <div class="nav-item"><div class="nav-icon">💎</div>Earn</div>
    </div>

    <!-- Bet Modal -->
    <div class="modal-overlay" id="bet-modal">
        <div class="modal-content" id="modal-content">
            <div class="modal-title">Enter Bet Amount (Max 10,000)</div>
            <input type="number" class="bet-input" id="bet-input" placeholder="0.00" min="1" max="10000">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-confirm" onclick="confirmBet()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 1000.00;
        let currentBet = 0;
        let isPlaying = false;
        let isWaiting = false;
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let gameInterval = null;
        let countdownInterval = null;

        const multText = document.getElementById('multiplier-text');
        const circle = document.getElementById('circle');
        const actionBtn = document.getElementById('action-btn');
        const balanceDisplay = document.getElementById('balance');
        const betModal = document.getElementById('bet-modal');
        const modalContent = document.getElementById('modal-content');
        const betInput = document.getElementById('bet-input');
        const rocket = document.getElementById('rocket');

        function updateUI() {
            balanceDisplay.innerText = balance.toFixed(2);
        }

        function handleAction() {
            if (isWaiting) return;
            
            if (isPlaying) {
                cashOut();
            } else {
                openModal();
            }
        }

        function openModal() {
            betInput.value = '';
            betModal.style.display = 'flex';
            setTimeout(() => {
                modalContent.classList.add('show');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.remove('show');
            setTimeout(() => {
                betModal.style.display = 'none';
            }, 300);
        }

        function confirmBet() {
            const bet = parseFloat(betInput.value);
            if (isNaN(bet) || bet <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            if (bet > balance) {
                alert("Insufficient balance.");
                return;
            }
            if (bet > 10000) {
                alert("Max bet is 10,000.");
                return;
            }

            closeModal();
            startBet(bet);
        }

        function startBet(bet) {
            currentBet = bet;
            balance -= currentBet;
            updateUI();

            isWaiting = true;
            actionBtn.disabled = true;
            actionBtn.innerText = "Waiting...";
            circle.className = 'circle-display countdown';
            rocket.classList.remove('flying');
            
            let counter = 10;
            multText.innerText = counter;
            multText.style.fontSize = '60px';

            // Haptic feedback for countdown
            tg.HapticFeedback.impactOccurred('light');

            countdownInterval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    multText.innerText = counter;
                    tg.HapticFeedback.impactOccurred('light');
                } else {
                    clearInterval(countdownInterval);
                    startFlying();
                }
            }, 1000);
        }

        function startFlying() {
            isWaiting = false;
            isPlaying = true;
            
            circle.className = 'circle-display';
            multText.style.fontSize = '48px';
            
            actionBtn.disabled = false;
            actionBtn.innerText = "Cash Out";
            actionBtn.classList.add('cashout');

            rocket.classList.add('flying');

            currentMultiplier = 1.00;
            multText.innerText = currentMultiplier.toFixed(2) + 'x';

            // Random crash point between 1.00 and 100.00
            crashPoint = Math.max(1.00, (Math.random() * 100));
            
            gameInterval = setInterval(() => {
                currentMultiplier += 0.01;
                multText.innerText = currentMultiplier.toFixed(2) + 'x';

                if (currentMultiplier >= crashPoint) {
                    gameOver();
                }
            }, 50); 
        }

        function cashOut() {
            clearInterval(gameInterval);
            isPlaying = false;
            rocket.classList.remove('flying');
            
            const winAmount = currentBet * currentMultiplier;
            balance += winAmount;
            updateUI();

            multText.innerText = `WON\n${winAmount.toFixed(2)} 💎`;
            multText.style.color = '#10b981';
            
            actionBtn.innerText = "Place bet";
            actionBtn.disabled = true;
            actionBtn.classList.remove('cashout');

            tg.HapticFeedback.notificationOccurred('success');

            setTimeout(resetGame, 3000);
        }

        function gameOver() {
            clearInterval(gameInterval);
            isPlaying = false;
            rocket.classList.remove('flying');
            
            circle.classList.add('crashed');
            multText.innerText = "CRASHED!";
            
            actionBtn.innerText = "Place bet";
            actionBtn.disabled = true;
            actionBtn.classList.remove('cashout');

            tg.HapticFeedback.notificationOccurred('error');

            setTimeout(resetGame, 3000);
        }

        function resetGame() {
            currentMultiplier = 1.00;
            circle.className = 'circle-display';
            multText.style.color = 'white';
            multText.innerText = "1.00x";
            multText.style.fontSize = '48px';
            
            actionBtn.innerText = "Place bet";
            actionBtn.disabled = false;
            actionBtn.classList.remove('cashout');
            
            isPlaying = false;
            isWaiting = false;
        }

        updateUI();
    </script>
</body>
</html>
