<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CrashX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0d0e12; 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- شاشة اللوبي (الرئيسية) --- */
        #lobby-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 15px;
            padding-bottom: 80px;
        }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; }
        .balance-box {
            background: #1e1f26; padding: 8px 15px; border-radius: 20px;
            display: flex; align-items: center; gap: 5px; font-weight: 700; color: #3b82f6;
        }
        .deposit-btn {
            background: #6d28d9; color: white; border: none; padding: 8px 15px;
            border-radius: 10px; font-weight: 600; font-size: 14px;
        }

        .lobby-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-card {
            border-radius: 25px; padding: 20px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; overflow: hidden; cursor: pointer;
            width: 100%; max-width: 350px; height: 250px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s;
        }
        .game-card:active { transform: scale(0.95); }
        
        .card-title { font-size: 36px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 2; }
        .card-badge { background: white; color: #ea580c; font-size: 12px; padding: 5px 12px; border-radius: 15px; font-weight: bold; position: absolute; top: 20px; left: 20px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; padding: 15px 10px;
            background: #14151a; border-top: 1px solid #222; z-index: 50;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; color: #666; }
        .nav-item.active { color: white; }
        .nav-icon { font-size: 20px; }

        /* --- شاشة اللعبة --- */
        #game-screen {
            display: none; flex-direction: column; height: 100%; position: relative;
        }
        
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: #14151a; z-index: 10;
        }
        .back-btn { background: #1e1f26; border: none; color: white; padding: 8px 15px; border-radius: 20px; font-weight: 600; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        .game-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
        }

        .circle-wrap { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; }
        .circle-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: #222; stroke-width: 4; }
        .circle-progress { fill: none; stroke: #fbbf24; stroke-width: 4; stroke-dasharray: 628; stroke-dashoffset: 0; transition: stroke-dashoffset 0.1s linear; }
        
        .multiplier-text { font-size: 56px; font-weight: 800; color: white; z-index: 2; }
        .multiplier-text.crashed { color: #ef4444; font-size: 36px; }
        .multiplier-text.countdown { color: #3b82f6; font-size: 72px; }

        .plane { position: absolute; font-size: 40px; opacity: 0; transition: transform 0.1s linear, opacity 0.3s; z-index: 1; }
        .plane.flying { opacity: 1; }

        .history-container { display: flex; gap: 8px; margin-top: 30px; padding: 0 15px; overflow-x: auto; width: 100%; justify-content: center; }
        .history-container::-webkit-scrollbar { display: none; }
        .hist-badge { padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; background: #1e1f26; border: 1px solid #333; }
        .hist-badge.red { border-color: #ef4444; color: #ef4444; }
        .hist-badge.green { border-color: #10b981; color: #10b981; }
        .hist-badge.blue { border-color: #3b82f6; color: #3b82f6; }

        .action-area { padding: 15px; background: #14151a; z-index: 10; }
        .place-bet-btn {
            width: 100%; padding: 18px; border: none; border-radius: 15px;
            font-size: 20px; font-weight: 800; color: white; cursor: pointer;
            background: linear-gradient(90deg, #0ea5e9, #3b82f6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: transform 0.1s;
        }
        .place-bet-btn:active { transform: scale(0.97); }
        .place-bet-btn.cashout { background: linear-gradient(90deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .place-bet-btn:disabled { background: #2a2b36; color: #666; box-shadow: none; }

        .players-list { padding: 10px 15px; background: #14151a; height: 200px; overflow-y: auto; border-top: 1px solid #222; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #1e1f26; padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #2a2b36; }
        .player-row.win { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 30px; height: 30px; border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; font-size: 14px; }
        .player-name { font-size: 14px; font-weight: 600; }
        .player-bet { font-size: 12px; color: #888; display: flex; align-items: center; gap: 3px; }
        .player-win { font-size: 14px; font-weight: 700; color: #10b981; }
        .player-mult { font-size: 12px; color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 2px 6px; border-radius: 5px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
        .modal-content { background: #1e1f26; width: 100%; border-top-left-radius: 25px; border-top-right-radius: 25px; padding: 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-content.show { transform: translateY(0); }
        .modal-title { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .bet-input-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
        .bet-input { flex: 1; background: #0d0e12; border: 1px solid #333; color: white; font-size: 24px; text-align: center; padding: 15px; border-radius: 12px; outline: none; font-weight: bold; }
        .quick-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .quick-btn { flex: 1; background: #2a2b36; border: none; color: white; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #2a2b36; color: white; }
        .btn-confirm { background: #3b82f6; color: white; }

    </style>
</head>
<body>

    <!-- ==================== شاشة اللوبي (الرئيسية) ==================== -->
    <div id="lobby-screen">
        <div class="header">
            <div class="user-profile">
                <div class="avatar" style="background: url('https://i.pravatar.cc/100?img=11') center/cover;"></div>
                <div>
                    <div style="font-size: 12px; color: #888;">Your balance</div>
                    <div style="font-size: 18px; font-weight: bold;">💎 <span id="lobby-balance">1000.00</span></div>
                </div>
            </div>
            <button class="deposit-btn">Deposit</button>
        </div>

        <div class="lobby-content">
            <!-- الزر الذي يفتح اللعبة -->
            <div class="game-card" id="open-game-btn">
                <div class="card-badge">🔥 HOT</div>
                <div class="card-title">
                    <span>🚀</span>
                    <span>ROCKET</span>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item"><div class="nav-icon">📦</div>Backpack</div>
            <div class="nav-item"><div class="nav-icon">👥</div>Invite</div>
            <div class="nav-item active"><div class="nav-icon">🏠</div>Home</div>
            <div class="nav-item"><div class="nav-icon">🏆</div>Leaderboard</div>
            <div class="nav-item"><div class="nav-icon">💎</div>Earn</div>
        </div>
    </div>

    <!-- ==================== شاشة اللعبة ==================== -->
    <div id="game-screen">
        <div class="game-header">
            <button class="back-btn" id="back-btn">← Back</button>
            <div style="font-weight: bold; background: #1e1f26; padding: 8px 15px; border-radius: 20px;">🎁 Epic Gift</div>
            <div style="background: #1e1f26; padding: 8px 15px; border-radius: 20px; color: #3b82f6; font-weight: bold;">
                💎 <span id="game-balance">1000.00</span>
            </div>
        </div>

        <div class="game-area">
            <div class="plane" id="plane">🚀</div>
            
            <div class="circle-wrap" id="circle-wrap">
                <svg class="circle-svg" viewBox="0 0 200 200">
                    <circle class="circle-bg" cx="100" cy="100" r="98"></circle>
                    <circle class="circle-progress" cx="100" cy="100" r="98" id="progress-circle"></circle>
                </svg>
                <div class="multiplier-text" id="multiplier-text">1.00x</div>
            </div>

            <div class="history-container" id="history-container"></div>
        </div>

        <div class="action-area">
            <button class="place-bet-btn" id="action-btn">Place bet</button>
        </div>

        <div class="players-list" id="players-list"></div>
    </div>

    <!-- نافذة الرهان -->
    <div class="modal-overlay" id="bet-modal">
        <div class="modal-content" id="modal-content">
            <div class="modal-title">Place your bet</div>
            <div class="bet-input-wrap">
                <input type="number" class="bet-input" id="bet-input" value="10.00">
            </div>
            <div class="quick-btns">
                <button class="quick-btn" onclick="setBet(10)">10</button>
                <button class="quick-btn" onclick="setBet(100)">100</button>
                <button class="quick-btn" onclick="setBet(1000)">1K</button>
                <button class="quick-btn" onclick="setBet(10000)">MAX</button>
            </div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="cancel-bet-btn">Cancel</button>
                <button class="modal-btn btn-confirm" id="confirm-bet-btn">Start</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0d0e12');
        tg.setBackgroundColor('#0d0e12');

        // --- المتغيرات الأساسية ---
        let balance = 1000.00;
        let currentBet = 0;
        let hasBetThisRound = false;
        let gameState = 'WAITING'; 
        let currentMultiplier = 1.00;
        let targetCrashPoint = 1.00;
        let countdownTimer = null;
        let gameInterval = null;
        
        // عناصر DOM
        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const actionBtn = document.getElementById('action-btn');
        const multText = document.getElementById('multiplier-text');
        const progressCircle = document.getElementById('progress-circle');
        const plane = document.getElementById('plane');
        const historyContainer = document.getElementById('history-container');
        const playersList = document.getElementById('players-list');
        const betModal = document.getElementById('bet-modal');
        const modalContent = document.getElementById('modal-content');
        const betInput = document.getElementById('bet-input');

        const fakeNames = ["DON", "O t h m a n", "|| sand...", "square ...", "Nacky", "10'", "مصطفى", "Alex", "CryptoKing", "LuckyBoi"];
        const fakeAvatars = ["👨‍🦲", "🧔", "👩", "😈", "🥷", "👽", "🤖", "🦁", "🐺", "🦊"];

        // --- ربط الأزرار (حل مشكلة عدم استجابة الزر) ---
        document.getElementById('open-game-btn').addEventListener('click', openGame);
        document.getElementById('back-btn').addEventListener('click', closeGame);
        actionBtn.addEventListener('click', handleAction);
        
        document.getElementById('cancel-bet-btn').addEventListener('click', closeModal);
        document.getElementById('confirm-bet-btn').addEventListener('click', confirmBet);

        // --- التنقل بين الشاشات ---
        function openGame() {
            lobbyScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            updateUI();
            startNewRound();
        }

        function closeGame() {
            gameScreen.style.display = 'none';
            lobbyScreen.style.display = 'flex';
            clearInterval(gameInterval);
            clearInterval(countdownTimer);
            gameState = 'WAITING';
        }

        function updateUI() {
            document.getElementById('lobby-balance').innerText = balance.toFixed(2);
            document.getElementById('game-balance').innerText = balance.toFixed(2);
        }

        // --- نافذة الرهان ---
        function handleAction() {
            if (gameState === 'WAITING' && !hasBetThisRound) {
                openModal();
            } else if (gameState === 'FLYING' && hasBetThisRound) {
                cashOut();
            }
        }

        function openModal() {
            betInput.value = "10.00";
            betModal.style.display = 'flex';
            setTimeout(() => modalContent.classList.add('show'), 10);
        }

        function closeModal() {
            modalContent.classList.remove('show');
            setTimeout(() => betModal.style.display = 'none', 300);
        }

        function setBet(amount) { betInput.value = amount.toFixed(2); }

        function confirmBet() {
            const bet = parseFloat(betInput.value);
            if (isNaN(bet) || bet < 1) { alert("Minimum bet is 1"); return; }
            if (bet > balance) { alert("Insufficient balance"); return; }
            
            closeModal();
            currentBet = bet;
            balance -= currentBet;
            updateUI();
            hasBetThisRound = true;
            
            actionBtn.innerText = "Waiting for next round...";
            actionBtn.disabled = true;
            actionBtn.classList.remove('cashout');
            
            addPlayerToList("You", "🧑‍💻", currentBet, null, false);
        }

        // --- منطق اللعبة ---
        function startNewRound() {
            gameState = 'WAITING';
            hasBetThisRound = false;
            currentMultiplier = 1.00;
            
            multText.innerText = "Next round";
            multText.className = "multiplier-text";
            multText.style.fontSize = "24px";
            progressCircle.style.strokeDashoffset = 0;
            plane.style.opacity = 0;
            
            actionBtn.innerText = "Place bet";
            actionBtn.disabled = false;
            actionBtn.classList.remove('cashout');
            
            setTimeout(() => {
                if (gameScreen.style.display === 'flex') {
                    startCountdown();
                }
            }, 3000);
        }

        function startCountdown() {
            gameState = 'COUNTDOWN';
            let timeLeft = 10;
            
            multText.innerText = timeLeft;
            multText.className = "multiplier-text countdown";
            multText.style.fontSize = "72px";

            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    multText.innerText = timeLeft;
                    progressCircle.style.strokeDashoffset = 628 - (timeLeft / 10) * 628;
                } else {
                    clearInterval(countdownTimer);
                    startFlight();
                }
            }, 1000);
        }

        function startFlight() {
            gameState = 'FLYING';
            currentMultiplier = 1.00;
            
            const r = Math.random();
            if (r < 0.5) { targetCrashPoint = 1.00 + (Math.random() * 0.9); } 
            else if (r < 0.8) { targetCrashPoint = 2.00 + (Math.random() * 3.0); } 
            else { targetCrashPoint = 5.00 + (Math.random() * 95.0); } 

            multText.className = "multiplier-text";
            multText.style.fontSize = "56px";
            multText.innerText = "1.00x";

            plane.style.opacity = 1;
            plane.classList.add('flying');

            if (hasBetThisRound) {
                actionBtn.innerText = "Cash Out";
                actionBtn.disabled = false;
                actionBtn.classList.add('cashout');
            }

            addFakePlayers();

            let speed = 50;
            gameInterval = setInterval(() => {
                let increment = 0.01 + (currentMultiplier * 0.001);
                currentMultiplier += increment;
                
                multText.innerText = currentMultiplier.toFixed(2) + 'x';

                let x = (Math.random() - 0.5) * 5;
                let y = (Math.random() - 0.5) * 5;
                plane.style.transform = `translate(${x}px, ${y}px) scale(${1 + currentMultiplier/50})`;

                if (currentMultiplier >= targetCrashPoint) {
                    triggerCrash();
                }
            }, speed);
        }

        function cashOut() {
            if (!hasBetThisRound) return;
            
            hasBetThisRound = false;
            const winAmount = currentBet * currentMultiplier;
            balance += winAmount;
            updateUI();

            actionBtn.innerText = `Won ${winAmount.toFixed(2)} 💎`;
            actionBtn.disabled = true;
            actionBtn.classList.remove('cashout');
            
            tg.HapticFeedback.notificationOccurred('success');
            updatePlayerInList("You", currentMultiplier);
        }

        function triggerCrash() {
            clearInterval(gameInterval);
            gameState = 'CRASHED';
            
            multText.innerText = "CRASHED!";
            multText.classList.add('crashed');
            plane.style.opacity = 0;
            plane.c
